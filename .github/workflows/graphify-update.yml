name: Remote Graphify Sync
on:
  push:
    branches: [ main, dev ]
  pull_request:
    types: [ closed ]
    branches: [ dev ]

jobs:
  update-graph:
    # Only run on pushes, or when a pull request to dev is successfully merged
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Python & UV
        uses: astral-sh/setup-uv@v1
        
      - name: Install Graphify
        run: uv tool install graphify

      - name: Run Incremental Graph Update
        run: graphify update ./raw --progress

      - name: Commit and Push Updated Graph
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://